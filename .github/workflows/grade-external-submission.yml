name: CP3 — Mother Repository Grader

on:
  issues:
    types: [opened, edited, reopened]
  issue_comment:
    types: [created, edited]

permissions:
  contents: write
  issues: write

jobs:
  grade:
    if: >-
      ${{
        github.repository == 'KLIS-CS/GitHub-Issues-Projects-Workflow' &&
        !github.event.issue.pull_request &&
        (
          startsWith(github.event.issue.title, '[CP3] Issues & Projects Submission') ||
          contains(github.event.issue.body, '### Practice Repository URL')
        )
      }}
    runs-on: ubuntu-latest

    steps:
      - name: Grade CP3 submission
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue = context.payload.issue;
            const issueNumber = issue.number;
            const student = issue.user.login;
            const marker = '<!-- klis-cp3-mother-score -->';
            const localMarker = '<!-- klis-cp3-progress -->';
            const allowedGraders = new Set(['hbycwyh2008']);

            const escapeRegex = value => value.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const section = label => {
              const re = new RegExp(`### ${escapeRegex(label)}\\s*\\n+([\\s\\S]*?)(?=\\n### |$)`, 'i');
              const value = issue.body?.match(re)?.[1]?.trim() || '';
              return value === '_No response_' ? '' : value;
            };

            function parseRepoUrl(value) {
              try {
                const u = new URL((value || '').trim());
                if (u.protocol !== 'https:' || u.hostname.toLowerCase() !== 'github.com') return null;
                const parts = u.pathname.split('/').filter(Boolean);
                if (parts.length < 2) return null;
                return { owner: parts[0], repo: parts[1].replace(/\.git$/i, '') };
              } catch { return null; }
            }

            async function publicJson(url) {
              const r = await fetch(url, { headers: { Accept: 'application/vnd.github+json', 'User-Agent': 'KLIS-CS-CP3-Mother-Grader' } });
              if (r.status === 404) return null;
              if (r.status === 403 || r.status === 429) throw new Error('GitHub API rate limit reached. Re-run later; this is not a student error.');
              if (!r.ok) throw new Error(`GitHub API returned ${r.status} for ${url}`);
              return await r.json();
            }

            function parseManualGrade(body) {
              if (!body) return null;
              const legacy = body.match(/(?:^|\n)\s*\/manual-grade\s+(40|[0-3]?\d)(?:\s|$)/i);
              if (legacy) return { score: Number(legacy[1]), breakdown: null, feedback: '' };
              if (!/(?:^|\n)\s*\/manual-grade\s*(?:\n|$)/i.test(body)) return null;
              const readScore = (label, max) => {
                const m = body.match(new RegExp(`^\\s*${escapeRegex(label)}:\\s*(\\d{1,2})\\s*\\/\\s*${max}\\s*$`, 'mi'));
                if (!m) return null;
                const n = Number(m[1]);
                return n <= max ? n : null;
              };
              const breakdown = {
                issue: readScore('Issue quality', 10),
                project: readScore('Project evidence', 10),
                concepts: readScore('Concepts', 15),
                reflection: readScore('Reflection', 5)
              };
              if (Object.values(breakdown).some(v => v === null)) return null;
              const feedback = body.match(/(?:^|\n)\s*Feedback:\s*\n([\s\S]*)$/i)?.[1]?.trim() || '';
              return { score: Object.values(breakdown).reduce((a,b) => a+b, 0), breakdown, feedback };
            }

            async function discoverRepositoryUrl() {
              try {
                const exact = await github.rest.repos.get({ owner: student, repo: 'cp3-issues-projects-workflow' });
                if (exact.data && exact.data.private === false) return exact.data.html_url;
              } catch (error) {
                if (error.status !== 404) core.warning(`Exact CP3 repository lookup failed: ${error.message}`);
              }

              const repos = await github.paginate(github.rest.repos.listForUser, {
                username: student, per_page: 100, sort: 'updated', direction: 'desc'
              });
              for (const candidate of repos.slice(0, 40)) {
                if (candidate.private) continue;
                try {
                  const details = await github.rest.repos.get({ owner: student, repo: candidate.name });
                  if (details.data.template_repository?.full_name === 'KLIS-CS/GitHub-Issues-Projects-Workflow') return details.data.html_url;

                  const workflow = await github.rest.repos.getContent({
                    owner: student,
                    repo: candidate.name,
                    path: '.github/workflows/grade.yml',
                    ref: candidate.default_branch || 'main'
                  });
                  if (!Array.isArray(workflow.data) && workflow.data.content) {
                    const text = Buffer.from(workflow.data.content, workflow.data.encoding).toString('utf8');
                    if (text.includes('klis-cp3-progress')) return candidate.html_url;
                  }
                } catch (error) {
                  if (error.status !== 404) core.warning(`Skipping ${candidate.name}: ${error.message}`);
                }
              }
              return '';
            }

            let repositoryUrl = section('Practice Repository URL');
            if (!repositoryUrl) repositoryUrl = await discoverRepositoryUrl();
            const statedUsername = section('GitHub Username').replace(/^@/, '').trim() || student;

            if (repositoryUrl && !section('Practice Repository URL')) {
              const autoDetected = [
                issue.body || '',
                '',
                '### Practice Repository URL',
                repositoryUrl,
                '',
                '### GitHub Username',
                student
              ].join('\n');
              await github.rest.issues.update({
                owner, repo, issue_number: issueNumber, body: autoDetected
              });
            }

            const parsed = parseRepoUrl(repositoryUrl);

            let automatic = 0;
            let progressUrl = null;
            let validation = 'Repository URL could not be parsed.';

            if (parsed) {
              const api = `https://api.github.com/repos/${encodeURIComponent(parsed.owner)}/${encodeURIComponent(parsed.repo)}`;
              const meta = await publicJson(api);
              if (!meta) validation = 'Repository not found.';
              else if (meta.private) validation = 'Repository is private. CP3 must be Public so the mother grader can read the trusted local grader output.';
              else if (meta.owner?.login?.toLowerCase() !== student.toLowerCase() || statedUsername.toLowerCase() !== student.toLowerCase()) validation = `Repository and submitted username must belong to @${student}.`;
              else {
                validation = 'Public student-owned repository detected.';
                const issues = await publicJson(`${api}/issues?state=all&per_page=100`) || [];
                const candidates = [];
                for (const item of issues) {
                  if (!item.comments) continue;
                  const comments = await publicJson(`${api}/issues/${item.number}/comments?per_page=100`) || [];
                  for (const c of comments) {
                    if (c.user?.login === 'github-actions[bot]' && c.body?.includes(localMarker)) candidates.push({ ...c, parent: item });
                  }
                }
                candidates.sort((a,b) => new Date(b.updated_at || b.created_at) - new Date(a.updated_at || a.created_at));
                const trusted = candidates[0];
                if (trusted) {
                  progressUrl = trusted.html_url || trusted.parent?.html_url || null;
                  const m = (trusted.body || '').match(/\*\*Automatic:\*\*\s*(\d+)\/60/i);
                  if (m) automatic = Math.max(0, Math.min(60, Number(m[1])));
                  validation += ` Trusted CP3 grader output found (${automatic}/60).`;
                } else validation += ' No trusted CP3 grader output found yet; run the student repository grader first.';
              }
            }

            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: issueNumber, per_page: 100 });
            let manual = null;
            for (const c of [...comments].sort((a,b) => new Date(b.updated_at) - new Date(a.updated_at))) {
              if (!allowedGraders.has(c.user?.login?.toLowerCase())) continue;
              const grade = parseManualGrade(c.body || '');
              if (grade) { manual = { ...grade, grader: c.user.login }; break; }
            }

            const teacher = manual?.score ?? 0;
            const total = automatic + teacher;
            const finalLine = manual ? `${total}/100` : 'pending teacher review';
            const status = automatic < 60 ? '🟡 **IN PROGRESS — complete the missing automatic evidence in the student repository.**' : !manual ? '🔵 **AUTOMATIC CHECKS PASSED — awaiting teacher review.**' : `✅ **FINAL SCORE: ${total}/100**`;
            const template = ['```text','/manual-grade','Issue quality: 0/10','Project evidence: 0/10','Concepts: 0/15','Reflection: 0/5','','Feedback:','Write concise feedback here.','```'].join('\n');
            const canonicalRepo = parsed ? `https://github.com/${parsed.owner}/${parsed.repo}` : repositoryUrl;

            const body = `${marker}
            ## CP3 Score — Mother Repository

            **Student:** @${student}  
            **Practice repository:** ${canonicalRepo || 'not provided'}  
            **Automatic score:** ${automatic}/60  
            **Teacher score:** ${manual ? `${teacher}/40 by @${manual.grader}` : 'awaiting review'}  
            **Final score:** ${finalLine}

            | Component | Score | Evidence |
            |---|---:|---|
            | ${automatic === 60 ? '✅' : automatic ? '🟨' : '⬜'} Trusted student automatic grader | ${automatic}/60 | ${validation} |
            | 🧑‍🏫 Teacher review | ${manual ? `${teacher}/40` : '—/40'} | ${manual ? `graded by @${manual.grader}` : 'awaiting review'} |

            ${status}

            ### Teacher review links
            - ${canonicalRepo ? `[Open student repository](${canonicalRepo})` : 'Student repository unavailable'}
            - ${progressUrl ? `[Open trusted CP3 progress evidence](${progressUrl})` : 'Trusted CP3 progress evidence not found'}

            > GitHub Project evidence remains teacher-reviewed because repository Actions may not have organization Projects access.

            ### 🧑‍🏫 Teacher grading
            Grade here in the mother repository. The teacher score is published to the student's own CP3 score display.

            ${template}

            **Re-grade:** after the student changes the repository, edit this submission Issue or add a comment.
            `;

            const old = comments.find(c => c.user?.type === 'Bot' && c.body?.includes(marker));
            if (old) await github.rest.issues.updateComment({ owner, repo, comment_id: old.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number: issueNumber, body });

            if (manual && parsed?.owner) {
              const gradeBranch = 'grades';
              try { await github.rest.git.getRef({ owner, repo, ref: `heads/${gradeBranch}` }); }
              catch (e) {
                if (e.status !== 404) throw e;
                const mainRef = await github.rest.git.getRef({ owner, repo, ref: 'heads/main' });
                await github.rest.git.createRef({ owner, repo, ref: `refs/heads/${gradeBranch}`, sha: mainRef.data.object.sha });
              }
              const gradePath = `.cp3-grades/${student.toLowerCase()}.json`;
              const gradeData = { version: 1, checkpoint: 'CP3', student: student.toLowerCase(), repository: canonicalRepo, automaticAtMother: automatic, teacherScore: teacher, finalAtMother: total, grader: manual.grader, breakdown: manual.breakdown, feedback: manual.feedback || '', submissionIssue: `https://github.com/${owner}/${repo}/issues/${issueNumber}`, updatedAt: new Date().toISOString() };
              let sha;
              try { const current = await github.rest.repos.getContent({ owner, repo, path: gradePath, ref: gradeBranch }); if (!Array.isArray(current.data)) sha = current.data.sha; }
              catch (e) { if (e.status !== 404) throw e; }
              await github.rest.repos.createOrUpdateFileContents({ owner, repo, path: gradePath, branch: gradeBranch, message: `Publish CP3 teacher grade for ${student}`, content: Buffer.from(JSON.stringify(gradeData, null, 2) + '\n').toString('base64'), ...(sha ? { sha } : {}) });
            }

            await core.summary.addHeading(`CP3: ${total}/100`).addRaw(`Automatic: ${automatic}/60\n`).addRaw(`Teacher: ${manual ? `${teacher}/40` : 'awaiting review'}\n`).write();
