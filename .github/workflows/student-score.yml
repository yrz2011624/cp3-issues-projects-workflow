name: CP3 — Student Score

on:
  workflow_run:
    workflows: ["Checkpoint 3 — Auto and Teacher Grade"]
    types: [completed]
  schedule:
    - cron: '31 * * * *'

permissions:
  contents: read
  issues: write

jobs:
  score:
    if: ${{ github.repository != 'KLIS-CS/GitHub-Issues-Projects-Workflow' }}
    runs-on: ubuntu-latest
    steps:
      - name: Sync teacher score into Exercise Issue
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const exerciseMarker = '<!-- klis-cp3-exercise -->';
            const progressMarker = '<!-- klis-cp3-progress -->';
            const teacherStart = '<!-- klis-cp3-teacher-sync-start -->';
            const teacherEnd = '<!-- klis-cp3-teacher-sync-end -->';

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'all', per_page: 100
            });
            const exercise = issues.find(i => !i.pull_request && i.body?.includes(exerciseMarker));
            if (!exercise) return;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: exercise.number, per_page: 100
            });
            const progress = comments.find(c => c.user?.login === 'github-actions[bot]' && c.body?.includes(progressMarker));
            if (!progress) return;

            const automatic = Math.max(0, Math.min(60,
              Number(progress.body?.match(/\*\*Automatic:\*\*\s*(\d+)\/60/i)?.[1] || 0)
            ));

            let teacher = null, grader = null, feedback = '', updatedAt = null;
            const gradeUrl = `https://raw.githubusercontent.com/KLIS-CS/GitHub-Issues-Projects-Workflow/grades/.cp3-grades/${encodeURIComponent(owner.toLowerCase())}.json?ts=${Date.now()}`;
            const response = await fetch(gradeUrl, { headers: { 'User-Agent': 'KLIS-CS-CP3-Student-Score' } });
            if (response.ok) {
              const grade = await response.json();
              if (Number.isInteger(grade.teacherScore)) teacher = grade.teacherScore;
              grader = grade.grader || null;
              feedback = grade.feedback || '';
              updatedAt = grade.updatedAt || null;
            } else if (response.status !== 404) core.warning(`Teacher grade sync returned HTTP ${response.status}.`);

            const total = automatic + (teacher ?? 0);
            const feedbackBlock = teacher === null
              ? 'Teacher feedback will appear here after grading in the mother repository.'
              : feedback ? `> ${feedback.replace(/\n/g, '\n> ')}` : '> Teacher grade published. No written feedback was included.';

            const teacherTemplate = teacher === null
              ? [
                  '',
                  '#### Teacher grading template',
                  '',
                  'Use this in the mother-repository CP3 submission Issue:',
                  '',
                  '```text',
                  '/manual-grade',
                  'Issue quality: 0/10',
                  'Project evidence: 0/10',
                  'Concepts: 0/15',
                  'Reflection: 0/5',
                  '',
                  'Feedback:',
                  'Write concise feedback here.',
                  '```'
                ].join('\n')
              : '';

            const teacherBlock = `${teacherStart}
            ### 🧑‍🏫 Teacher review — 40 points

            **Teacher score:** ${teacher === null ? 'awaiting review' : `${teacher}/40${grader ? ` by @${grader}` : ''}`}  
            **Final score:** ${teacher === null ? 'pending teacher review' : `${total}/100`}

            ${teacher === null ? '🔵 **Awaiting teacher review.**' : `✅ **FINAL SCORE: ${total}/100**`}
            ${teacherTemplate}

            #### Teacher feedback
            ${feedbackBlock}
            ${updatedAt ? `\n_Last synced: ${updatedAt}_` : ''}
            ${teacherEnd}`;

            const re = new RegExp(`${teacherStart}[\\s\\S]*?${teacherEnd}`);
            let body = progress.body || '';
            body = re.test(body) ? body.replace(re, teacherBlock) : body + `\n\n${teacherBlock}`;

            await github.rest.issues.updateComment({ owner, repo, comment_id: progress.id, body });
            await core.summary.addHeading(`CP3: ${teacher === null ? `${automatic}/60 automatic` : `${total}/100`}`).write();
